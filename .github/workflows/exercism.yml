name: Auto-merge Exercism Branches

on:
  push:
    branches-ignore:
      - main

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fusionar rama en main
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          git checkout main
          git pull origin main
          git merge "origin/$BRANCH_NAME" --no-ff -m "Exercism auto-merge: $BRANCH_NAME"
          git push origin main

      - name: Eliminar rama temporal
        if: success()
        run: |
          git push origin --delete "${{ github.ref_name }}"
